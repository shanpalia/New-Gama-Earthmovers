<script>
/* =========================================
   NEW GAMA EARTHMOVERS
   TOTAL ORDERS CARD DIRECT FIX
   ========================================= */

(function () {

    /* Owner access save */
    function saveOwnerAccess() {
        sessionStorage.setItem(
            'newGamaOwnerAuthorized',
            'true'
        );

        localStorage.setItem(
            'newGamaOwnerAuthorized',
            'true'
        );
    }


    /* Open Orders Page */
    function openOrders(event) {

        if (event) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
        }

        /* Keep owner authorization */
        saveOwnerAccess();

        /* Direct Orders Page */
        window.location.href =
            'orders.html?owner_access=1&from=owner.html';

        return false;
    }


    /* Find Total Orders Card */
    function setupTotalOrdersCard() {

        /* Common dashboard card selectors */
        const allCards = document.querySelectorAll(
            `
            .stat-card,
            .dashboard-card,
            .card,
            .stats-card,
            .total-card,
            [id="totalOrdersCard"],
            [id="ordersCard"],
            [id="total-orders"],
            [id="totalOrders"],
            [class*="order"]
            `
        );


        allCards.forEach(function (card) {

            const text = (
                card.innerText ||
                card.textContent ||
                ''
            )
            .replace(/\s+/g, ' ')
            .trim()
            .toLowerCase();


            /* Only Total Orders Card */
            if (
                text.includes('total orders') ||
                text.includes('click to view orders')
            ) {

                console.log(
                    'Total Orders Card Found'
                );


                /* Make clickable */
                card.style.cursor = 'pointer';


                /* Remove inline old onclick */
                card.onclick = null;


                /*
                 Capture mode true:
                 This runs before old click
                 handlers which may redirect
                 to users.html
                */
                card.addEventListener(
                    'click',
                    function (event) {

                        openOrders(event);

                    },
                    true
                );


                /*
                 If card is inside a link,
                 disable parent link behavior
                */
                const parentLink =
                    card.closest('a');

                if (parentLink) {

                    parentLink.href =
                        'orders.html?owner_access=1&from=owner.html';

                    parentLink.onclick =
                        function (event) {

                            openOrders(event);

                        };

                }


                /*
                 Also check buttons inside card
                */
                const buttons =
                    card.querySelectorAll(
                        'button, a'
                    );

                buttons.forEach(
                    function (button) {

                        button.onclick =
                            function (event) {

                                openOrders(event);

                            };

                    }
                );

            }

        });

    }


    /* Page Ready */
    if (
        document.readyState === 'loading'
    ) {

        document.addEventListener(
            'DOMContentLoaded',
            setupTotalOrdersCard
        );

    } else {

        setupTotalOrdersCard();

    }


    /*
      Run again because dashboard
      cards may load dynamically
    */
    setTimeout(
        setupTotalOrdersCard,
        500
    );

    setTimeout(
        setupTotalOrdersCard,
        1500
    );

})();
</script>
