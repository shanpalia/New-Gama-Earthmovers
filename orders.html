<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | New Gama Earthmovers</title>
<link rel="icon" type="image/png" href="new-gama-logo.png">
<style>
:root{--yellow:#f5b400;--dark:#171717;--dark2:#242424;--light:#f5f6f7;--white:#fff;--text:#242424;--muted:#777;--border:#e6e6e6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--light);color:var(--text)}
button{font:inherit;cursor:pointer}
.topbar{height:70px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10000}
.top-left{display:flex;align-items:center;gap:14px}
.menu-btn{width:42px;height:42px;border:0;background:transparent;color:#fff;font-size:26px;border-radius:7px}
.menu-btn:hover{background:#303030}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--yellow)}
.brand b{font-size:16px}.brand small{display:block;color:#aaa;font-size:11px;margin-top:3px}.owner{font-size:13px;color:#ccc}
.sidebar{position:fixed;left:0;top:70px;bottom:0;width:260px;display:block;background:var(--dark2);color:#eee;transform:translateX(-100%);transition:transform .25s ease;z-index:9999;padding:20px 12px;box-shadow:8px 0 30px rgba(0,0,0,.18)}
.sidebar.open{transform:translateX(0)}.sidebar-title{color:#aaa;font-size:11px;font-weight:bold;padding:5px 12px 12px;letter-spacing:.7px}
.nav-item{width:100%;border:0;background:transparent;color:#eee;display:flex;align-items:center;gap:13px;text-align:left;padding:14px;border-radius:8px;margin:4px 0;font-weight:bold}
.nav-item:hover,.nav-item.active{background:#343434}.nav-item.active{color:var(--yellow)}.nav-icon{width:24px;text-align:center;font-size:18px}.logout{margin-top:18px;color:#ffb0a8}
.backdrop{display:none;position:fixed;inset:70px 0 0;background:rgba(0,0,0,.35);z-index:9998}.backdrop.show{display:block}
main{max-width:1250px;margin:auto;padding:28px 22px 50px}.page{display:none}.page.active{display:block}.page-header{margin-bottom:24px}
.page-header h1{font-size:28px;margin-bottom:6px}.page-header p{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px}.stat{background:#fff;border-radius:12px;padding:20px;border:1px solid var(--border)}
.stat b{display:block;font-size:28px;margin-top:8px}.stat span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:22px}.card h2{font-size:19px;margin-bottom:15px}
.empty{padding:35px 15px;text-align:center;color:var(--muted);border:1px dashed #ccc;border-radius:9px}
label{display:block;font-size:13px;font-weight:bold;margin:15px 0 7px}
input,textarea,select{width:100%;border:1px solid #dcdcdc;border-radius:7px;padding:13px;font:inherit;outline:none;background:#fff}
input:focus,textarea:focus,select:focus{border-color:var(--yellow)}textarea{min-height:100px;resize:vertical}
.primary{background:var(--yellow);border:0;border-radius:7px;padding:13px 22px;font-weight:bold;margin-top:18px}
.secondary{background:#eee;border:0;border-radius:7px;padding:13px 22px;font-weight:bold;margin-top:18px}
.add-product-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.product-preview{position:sticky;top:92px}.preview-card{overflow:hidden;padding:0}
.preview-image-wrap{height:300px;background:#f3f3f3;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border)}
.preview-image-wrap img{width:100%;height:100%;object-fit:contain;display:none;background:#fff}
.preview-placeholder{text-align:center;color:#999;padding:30px}.camera{font-size:42px;display:block;margin-bottom:10px}
.preview-details{padding:20px}.preview-category{font-size:12px;font-weight:bold;color:#9a7200;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.preview-title{font-size:22px;margin-bottom:8px;word-break:break-word}.preview-part{font-size:13px;color:var(--muted);margin-bottom:12px}
.preview-price{font-size:26px;font-weight:bold;margin:10px 0}.preview-description{color:#666;font-size:14px;white-space:pre-wrap}
.image-upload-box{border:2px dashed #d2d2d2;border-radius:9px;padding:18px;background:#fafafa}.image-help{font-size:12px;color:#777;margin-top:8px}
    .multi-image-preview{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
    .upload-slot{aspect-ratio:1;border:2px dashed #cfcfcf;border-radius:9px;background:#fafafa;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
    .upload-slot.main-slot{border-color:#f5b400;background:#fffaf0}
    .upload-slot img{width:100%;height:100%;object-fit:cover;display:none}
    .upload-slot .slot-empty{text-align:center;color:#888;font-size:12px;padding:8px}
    .upload-slot .slot-empty b{display:block;font-size:20px;color:#555;margin-bottom:5px}
    .upload-slot .main-tag{position:absolute;top:5px;left:5px;background:#f5b400;color:#171717;font-size:10px;font-weight:bold;padding:4px 6px;border-radius:5px}
    .upload-slot input{position:absolute;inset:0;opacity:0;cursor:pointer}
    .slot-remove{position:absolute;right:5px;top:5px;border:0;background:#fff;color:#c33;width:24px;height:24px;border-radius:50%;font-weight:bold;display:none;z-index:3}
    .multi-image-thumb{aspect-ratio:1;border:1px solid var(--border);border-radius:7px;overflow:hidden;background:#fafafa;position:relative}
    .multi-image-thumb img{width:100%;height:100%;object-fit:cover}
    .thumb-remove{position:absolute;right:3px;top:3px;border:0;background:#fff;color:#c33;width:22px;height:22px;border-radius:50%;font-weight:bold}
    .manage-actions{display:flex;gap:8px;margin-top:12px}
    .edit{border:0;background:#fff3c9;padding:9px 12px;border-radius:6px;font-weight:bold}
    .save-edit{background:var(--yellow);border:0;border-radius:7px;padding:13px 22px;font-weight:bold;margin-top:18px}
    .gallery-note{font-size:12px;color:#777;margin-top:8px}
.item-list{display:grid;gap:12px}.item-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:16px;border:1px solid var(--border);border-radius:9px}
.item-row small{display:block;color:var(--muted);margin-top:4px}.remove{border:0;background:#fff0ef;color:#c73b2d;padding:9px 12px;border-radius:6px}
.category-box{display:flex;gap:10px;align-items:center}.category-box input{flex:1}.category-box button{margin:0;padding:12px 18px}
.category-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.chip{background:#fff8df;border:1px solid #f0d274;padding:8px 10px;border-radius:20px;font-size:13px;font-weight:bold}
.chip button{margin-left:7px;border:0;background:transparent;color:#b52f24;font-weight:bold}
.category-note{font-size:12px;color:#777;margin-top:8px}
.category-select-row{display:flex;gap:10px}.category-select-row select{flex:1}.category-select-row button{margin:0;padding:10px 15px;background:#eee}
.product-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.product-card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}.product-card img{width:100%;height:180px;object-fit:contain;background:#fafafa;border-bottom:1px solid var(--border)}
.product-card-body{padding:15px}.product-card-body h3{font-size:17px;margin-bottom:7px}.product-meta{font-size:12px;color:#777;margin:4px 0}.product-price{font-size:21px;font-weight:bold;margin-top:10px}
.badge{display:inline-block;font-size:11px;background:#fff3c9;padding:5px 8px;border-radius:12px;margin-bottom:8px}
@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.grid,.add-product-layout{grid-template-columns:1fr}.product-preview{position:static}}
@media(max-width:550px){.topbar{padding:0 12px}.owner{display:none}.brand b{font-size:13px}main{padding:22px 14px 40px}.stats{gap:10px}.stat{padding:15px}.stat b{font-size:23px}.category-select-row{flex-direction:column}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style id="ng-owner-order-notification-style">
#ngOwnerBell{position:relative;background:transparent;border:0;font-size:25px;cursor:pointer;padding:7px;display:none}
#ngOwnerBell.show{display:inline-block}
#ngOwnerBellBadge{position:absolute;top:1px;right:0;min-width:17px;height:17px;border-radius:50%;background:#dc2626;color:#fff;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center}
#ngOwnerNoticePanel{display:none;position:fixed;top:64px;right:18px;width:min(380px,calc(100vw - 36px));max-height:70vh;overflow:auto;background:#fff;color:#111;border-radius:14px;box-shadow:0 15px 45px rgba(0,0,0,.25);z-index:999999;padding:12px}
.ng-owner-notice{padding:12px;border-bottom:1px solid #eee;font-size:13px}.ng-owner-notice.new{background:#fff8db}
</style>

<style id="ng-order-complete-css">
#ngOwnerBell{position:fixed!important;top:10px;right:16px;z-index:1000001;background:#fff;border:1px solid #e5e7eb;border-radius:50%;box-shadow:0 4px 14px rgba(0,0,0,.18);width:46px;height:46px}
#ngOwnerBellBadge{top:-3px!important;right:-3px!important}
#ngOwnerNoticePanel{z-index:1000002!important;top:64px!important}
.ng-owner-notice{cursor:pointer;border-radius:8px;margin:5px 0}.ng-owner-notice:hover{background:#f3f4f6}
#ngOrderDetailModal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000005;display:none;align-items:center;justify-content:center;padding:15px}
#ngOrderDetailModal.show{display:flex}
.ng-order-detail-card{background:#fff;width:min(650px,100%);max-height:90vh;overflow:auto;border-radius:16px;padding:22px;color:#111}
.ng-order-detail-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding-bottom:12px;margin-bottom:14px}
.ng-order-detail-close{border:0;background:#f1f3f5;border-radius:50%;width:36px;height:36px;font-size:21px;cursor:pointer}
.ng-order-info{line-height:1.8}.ng-complete-btn{width:100%;margin-top:18px;padding:15px;border:0;border-radius:10px;background:#159447;color:#fff;font-size:16px;font-weight:800;cursor:pointer}
.ng-complete-btn:disabled{opacity:.6;cursor:not-allowed}
.ng-order-status{display:inline-block;padding:4px 9px;border-radius:20px;background:#fff3c9;font-size:12px;font-weight:800}
</style>

</head>
<body>
<div style="max-width:1100px;margin:35px auto;padding:0 16px;font-family:Arial,sans-serif">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <div><h1 style="margin:0">Orders</h1><p style="color:#666">All pickup orders</p></div>
    <button onclick="location.href='owner.html'" style="padding:10px 16px;border:1px solid #ddd;border-radius:9px;background:#fff;cursor:pointer">← Dashboard</button>
  </div>
  <div style="margin:18px 0;display:flex;gap:10px">
    <button onclick="loadOrders('all')">All</button>
    <button onclick="loadOrders('pending')">Pending</button>
    <button onclick="loadOrders('completed')">Completed</button>
  </div>
  <div id="ordersList">Loading orders...</div>
</div>
<script>
const URL='https://gozvchqatiyebpnycubl.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvenZjaHFhdGl5ZWJwbnljdWJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5Nzk0MjksImV4cCI6MjEwMzU1NTQyOX0.dkmoWjirh_J8L4c4x9QTisyMQy3lrWe4HQdZiHKAF40';
let sb;
async function loadOrders(filter='all'){
 const box=document.getElementById('ordersList');
 if(!window.supabase||!window.supabase.createClient){box.textContent='Supabase failed to load.';return;}
 sb=sb||window.supabase.createClient(URL,KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
 const {data,error}=await sb.from('new_gama_orders').select('*').order('created_at',{ascending:false});
 if(error){box.textContent='Could not load orders: '+error.message;return;}
 let rows=data||[];
 if(filter==='pending') rows=rows.filter(x=>String(x.status||'new').toLowerCase()!=='completed');
 if(filter==='completed') rows=rows.filter(x=>String(x.status||'').toLowerCase()==='completed');
 if(!rows.length){box.innerHTML='<p>No orders found.</p>';return;}
 box.innerHTML='<p style="color:#666;margin-bottom:14px"><b>'+rows.length+'</b> order(s) found</p>'+rows.map(o=>`<div onclick="location.href='order.html?order=${encodeURIComponent(o.id)}'" style="cursor:pointer;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:12px">
   <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><b>${o.customer_name||'Customer'}</b><b>${String(o.status||'new').toUpperCase()}</b></div>
   <div style="margin-top:8px;color:#666;font-size:13px">📅 ${o.created_at ? new Date(o.created_at).toLocaleString() : 'Date unavailable'}</div><div style="margin-top:8px">${o.product_name||''}</div>
   <div style="margin-top:8px">Qty: ${o.quantity||''} · Total: ₹${o.total_amount||0} · ${o.payment_method==='upi'?'UPI':'Cash'}</div>
 </div>`).join('');
}
document.addEventListener('DOMContentLoaded',()=>loadOrders());
</script>
</body></html>
