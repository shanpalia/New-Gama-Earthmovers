<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Profile | New Gama Earthmovers</title>
<link rel="icon" type="image/png" href="new-gama-logo.png">
<style>
:root{--yellow:#f5b400;--dark:#181818;--bg:#f5f6f8;--card:#fff;--border:#e5e7eb;--muted:#737883}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#20242a}
header{height:74px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
header a{color:#fff;text-decoration:none;font-weight:700}.brand{font-weight:800}
main{width:min(900px,calc(100% - 28px));margin:30px auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;margin-bottom:18px;box-shadow:0 10px 28px rgba(0,0,0,.04)}
.profile{display:flex;gap:18px;align-items:center}.avatar{width:78px;height:78px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-size:28px;font-weight:900}
h1{margin:0 0 7px}.muted{color:var(--muted);margin:0}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}
.primary{background:var(--yellow);color:#181818}.secondary{background:#fff;border:1px solid var(--border);color:#222}.danger{background:#222;color:#fff}
.info{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.item{border:1px solid var(--border);border-radius:12px;padding:15px}.item b{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}
@media(max-width:600px){header{padding:0 14px}.profile{align-items:flex-start}.info{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><a href="index.html">← Back to Homepage</a><div class="brand">NEW GAMA EARTHMOVERS</div></header>
<main>
<section class="card">
  <div class="profile">
    <div class="avatar" id="avatar">U</div>
    <div><h1 id="name">Loading...</h1><p class="muted" id="email">Loading...</p></div>
  </div>
  <div class="actions">
    <a class="btn primary" href="myorders.html">📦 My Orders & Tracking</a>
    <button class="btn danger" id="logout">Logout</button>
  </div>
</section>
<section class="card">
  <h2>Account Details</h2>
  <div class="info">
    <div class="item"><b>DISPLAY NAME</b><span id="detailName">—</span></div>
    <div class="item"><b>EMAIL</b><span id="detailEmail">—</span></div>
  </div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://gozvchqatiyebpnycubl.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvenZjaHFhdGl5ZWJwbnljdWJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5Nzk0MjksImV4cCI6MjEwMzU1NTQyOX0.dkmoWjirh_J8L4c4x9QTisyMQy3lrWe4HQdZiHKAF40';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
(async()=>{
 const {data:{session}}=await sb.auth.getSession();
 if(!session){location.href='users.html';return;}
 const u=session.user;
 const email=u.email||'';
 const name=(u.user_metadata?.full_name||email.split('@')[0]||'Customer').trim();
 const initials=(name.match(/[A-Za-z0-9]/g)||['U']).join('').slice(0,2).toUpperCase();
 document.getElementById('avatar').textContent=initials;
 document.getElementById('name').textContent=name;
 document.getElementById('email').textContent=email;
 document.getElementById('detailName').textContent=name;
 document.getElementById('detailEmail').textContent=email;
})();
document.getElementById('logout').onclick=async()=>{localStorage.removeItem('ng_customer_identity');await sb.auth.signOut();location.href='index.html';};
</script>
</body></html>
