<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Gama Earthmovers | Heavy Equipment Spare Parts</title>
  <meta name="description" content="New Gama Earthmovers - Heavy Equipment Spare Parts & Solutions.">
  <link rel="icon" type="image/png" href="new-gama-logo.png">

  <style>
    :root{--yellow:#f5b400;--dark:#181818;--light:#f6f6f6;--muted:#707070}
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:Arial,Helvetica,sans-serif;background:var(--light);color:#222}
    a{text-decoration:none;color:inherit}
    .top{background:var(--dark);color:#ddd;padding:9px 5%;text-align:center;font-size:13px}
    header{background:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px #0001}
    nav{max-width:1200px;margin:auto;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;gap:20px}
    .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;color:var(--dark)}
    .brand-logo{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--yellow);cursor:pointer;user-select:none;-webkit-user-drag:none}
    .brand span{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:3px}
    .links{display:flex;gap:20px;font-weight:bold;font-size:14px}
    .links a:hover{color:#a87800}
    .hero{min-height:500px;display:flex;align-items:center;background:linear-gradient(90deg,#111e,#1119),linear-gradient(135deg,#333,#777);color:white}
    .hero>div,.container{width:100%;max-width:1200px;margin:auto;padding:70px 20px}
    .hero-logo{width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid var(--yellow);margin-bottom:18px;box-shadow:0 8px 30px #0008}
    .badge{display:inline-block;background:var(--yellow);color:#111;padding:7px 12px;font-size:12px;font-weight:bold;margin-bottom:15px}
    h1{font-size:clamp(38px,6vw,70px);max-width:700px;line-height:1.05}
    .hero p{max-width:600px;margin:20px 0 28px;color:#ddd;font-size:17px}
    .btn{display:inline-block;background:var(--yellow);color:#111;padding:14px 23px;font-weight:bold;border-radius:5px}
    .btn.outline{background:transparent;color:white;border:1px solid #aaa;margin-left:10px}
    .search{max-width:850px;margin:-30px auto 0;background:white;padding:12px;display:flex;gap:10px;box-shadow:0 8px 25px #0002;border-radius:8px}
    input{flex:1;padding:14px;border:1px solid #ddd;border-radius:5px;font-size:15px}
    button{background:var(--yellow);border:0;padding:0 24px;font-weight:bold;border-radius:5px;cursor:pointer}
    .title{text-align:center;margin-bottom:30px}.title h2{font-size:34px}.title p{color:var(--muted)}
    .empty{background:white;border:1px dashed #ccc;border-radius:10px;padding:45px;text-align:center;color:var(--muted)}
    .empty strong{color:#222}
    .contact{background:var(--dark);color:white}
    .contact .container{display:grid;grid-template-columns:1fr 1fr;gap:30px}
    .card{background:#272727;padding:18px;margin-bottom:10px;border-left:4px solid var(--yellow);border-radius:5px}
    footer{background:#0b0b0b;color:#aaa;text-align:center;padding:25px;font-size:13px}
    @media(max-width:650px){
      .links{display:none}.brand{font-size:15px}.brand-logo{width:45px;height:45px}
      .hero{min-height:460px}.search{margin:-25px 12px 0;flex-direction:column}
      .search button{padding:14px}.contact .container{grid-template-columns:1fr}.btn.outline{margin:10px 0 0}
    }

    .security-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:1000;align-items:center;justify-content:center;padding:20px}
    .security-modal.show{display:flex}
    .security-box{width:min(430px,100%);background:#fff;border-radius:14px;padding:28px;box-shadow:0 20px 70px rgba(0,0,0,.45)}
    .security-icon{width:58px;height:58px;border-radius:50%;background:#fff5cc;display:grid;place-items:center;font-size:28px;margin-bottom:12px}
    .security-box h2{font-size:24px;margin-bottom:8px}.security-box p{color:#666;font-size:14px;line-height:1.5}
    .security-box label{display:block;font-weight:bold;font-size:13px;margin:16px 0 7px}.security-box input{width:100%;padding:13px;border:1px solid #ddd;border-radius:7px;font-size:16px}
    .security-actions{display:flex;gap:10px;margin-top:18px}.security-actions button{padding:13px 18px;border-radius:7px}.cancel-btn{background:#eee;color:#222}.security-error{display:none;color:#c62828;font-size:13px;margin-top:10px}
  </style>

<style id="customer-products-style">
.store-products{max-width:1200px;margin:32px auto;padding:0 20px}
.store-products h2{margin-bottom:8px}.store-products p{color:#777;margin-bottom:20px}
.customer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.customer-card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .2s}
.customer-card:hover{transform:translateY(-3px)}
.customer-card img{width:100%;height:210px;object-fit:contain;background:#fafafa}
.customer-card-body{padding:15px}.customer-card-body h3{margin:0 0 8px;font-size:18px}
.customer-badge{display:inline-block;background:#fff3c9;padding:5px 8px;border-radius:12px;font-size:11px;font-weight:bold;margin-bottom:8px}
.customer-price{font-size:22px;font-weight:bold;margin-top:10px}
.customer-empty{padding:35px;border:1px dashed #ccc;border-radius:10px;text-align:center;color:#777}
.product-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:99999;padding:20px;overflow:auto}
.product-modal.show{display:block}
.product-modal-box{max-width:1050px;margin:25px auto;background:#fff;border-radius:14px;overflow:hidden;position:relative}
.product-close{position:absolute;right:12px;top:12px;width:38px;height:38px;border:0;border-radius:50%;font-size:24px;z-index:5;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.product-detail{display:grid;grid-template-columns:1.1fr .9fr}
.gallery-main{height:470px;background:#fafafa;display:flex;align-items:center;justify-content:center;padding:20px}
.gallery-main img{max-width:100%;max-height:100%;object-fit:contain}
.gallery-thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px;background:#fff}
.gallery-thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border:2px solid transparent;border-radius:7px;cursor:pointer}
.gallery-thumbs img.active{border-color:#f5b400}
.product-info{padding:34px}.product-info h2{font-size:30px;margin:8px 0}.product-info .price{font-size:28px;font-weight:bold;margin:18px 0}
.product-info .meta{color:#666;margin:8px 0}.product-info .desc{line-height:1.6;color:#555;margin-top:18px}
@media(max-width:800px){.product-detail{grid-template-columns:1fr}.gallery-main{height:330px}.product-info{padding:22px}}
</style>



<script>
/* New Gama Earthmovers - Homepage Supabase REST connection.
   No CDN / Supabase JS SDK required. */
(function() {
  const BASE = "https://gozvchqatiyebpnycubl.supabase.co";
  const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvenZjaHFhdGl5ZWJwbnljdWJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5Nzk0MjksImV4cCI6MjEwMzU1NTQyOX0.dkmoWjirh_J8L4c4x9QTisyMQy3lrWe4HQdZiHKAF40";

  function esc(v) {
    const d=document.createElement('div');
    d.textContent=v == null ? '' : String(v);
    return d.innerHTML;
  }

  function container() {
    return document.getElementById('customerProductList') ||
           document.getElementById('productList') ||
           document.getElementById('productsList') ||
           document.getElementById('productsGrid') ||
           document.querySelector('.products-grid') ||
           document.querySelector('.product-grid') ||
           document.querySelector('[data-products]');
  }

  async function api(path) {
    const r=await fetch(BASE + '/rest/v1/' + path, {
      headers:{
        'apikey':KEY,
        'Authorization':'Bearer ' + KEY
      }
    });
    if(!r.ok) {
      const t=await r.text();
      throw new Error('Supabase HTTP '+r.status+': '+t);
    }
    return r.json();
  }

  async function loadProducts() {
    const box=container();
    if(!box) {
      console.error('New Gama: product container not found');
      return;
    }
    box.innerHTML='<div class="customer-empty">Loading products...</div>';

    try {
      const [products,categories]=await Promise.all([
        api('new_gama_products?select=*&order=created_at.desc'),
        api('new_gama_categories?select=id,name')
      ]); 

      const cat=Object.fromEntries((categories||[]).map(c=>[c.id,c.name]));
      console.log('New Gama Homepage: loaded',products.length,'products from Supabase REST');

      if(!products.length) {
        box.innerHTML='<div class="customer-empty">No products available yet.</div>';
        return;
      }

      box.innerHTML=products.map(p=>{
        const image=p.main_image_url||p.image_2_url||p.image_3_url||p.image_4_url||p.image_5_url||'new-gama-logo.png';
        const currency=String(p.currency||'INR').toUpperCase();
        const price=(currency==='NPR'?'रु ':'₹ ')+(p.price??0);
        return `<article class="customer-card product-card" data-product-id="${esc(p.id)}">
          <img src="${esc(image)}" alt="${esc(p.name)}" loading="lazy"
               onerror="this.onerror=null;this.src='new-gama-logo.png'">
          <div class="customer-card-body">
            ${cat[p.category_id]?`<span class="customer-badge">${esc(cat[p.category_id])}</span>`:''}
            <h3>${esc(p.name)}</h3>
            ${p.part_number?`<div style="color:#777;font-size:13px;margin-top:4px">Part No: ${esc(p.part_number)}</div>`:''}
            <div class="customer-price">${price}</div>
          </div>
        </article>`;
      }).join('');
    } catch(err) {
      console.error('New Gama Homepage REST Error:',err);
      box.innerHTML='<div class="customer-empty">Products could not be loaded.</div>';
    }
  }

  document.addEventListener('DOMContentLoaded',loadProducts);
  window.addEventListener('pageshow',loadProducts);
  window.loadNewGamaProducts=loadProducts;
})();
</script>

</body>
</html>
