<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Orders | New Gama Earthmovers</title>
<link rel="icon" type="image/png" href="new-gama-logo.png">
<style>
:root{--yellow:#f5b400;--dark:#171717;--bg:#f5f6f8;--card:#fff;--border:#e4e7eb;--muted:#737983;--green:#16834a;--blue:#276ef1}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#20242a}
header{height:74px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
header a{color:#fff;text-decoration:none;font-weight:700}.brand{font-weight:800}
main{width:min(1050px,calc(100% - 28px));margin:28px auto}.hero{margin-bottom:20px}.hero h1{margin:0 0 6px}.hero p{margin:0;color:var(--muted)}
.order{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 9px 24px rgba(0,0,0,.04)}
.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;flex-wrap:wrap}.product{font-size:19px;font-weight:800}.id,.date,.meta{font-size:13px;color:var(--muted);margin-top:5px}
.amount{font-size:20px;font-weight:900}.status{display:inline-block;margin-top:7px;padding:7px 10px;border-radius:999px;background:#fff3c8;font-size:12px;font-weight:800}
.status.done{background:#eaf8ef;color:var(--green)}
.track{margin-top:22px;border-top:1px solid var(--border);padding-top:18px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:relative}.step{text-align:center;position:relative}.dot{width:32px;height:32px;border-radius:50%;background:#e7e9ed;color:#8a9099;display:grid;place-items:center;margin:0 auto 8px;font-size:14px;font-weight:900}.step.active .dot{background:var(--yellow);color:#222}.step.done .dot{background:var(--green);color:#fff}.step b{font-size:12px}.step small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.line{height:4px;background:#e7e9ed;position:absolute;left:12.5%;right:12.5%;top:14px;z-index:0}.steps .step{z-index:1}.steps .dot{position:relative;z-index:2}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--yellow);border-color:var(--yellow)}
.empty{background:#fff;border:1px dashed #cfd4dc;border-radius:18px;padding:60px 20px;text-align:center;color:var(--muted)}
.loading{text-align:center;padding:55px;color:var(--muted)}
@media(max-width:680px){header{padding:0 14px}.steps{grid-template-columns:1fr 1fr;gap:20px}.line{display:none}.order{padding:17px}}
</style>
</head>
<body>
<header><a href="profile.html">← My Profile</a><div class="brand">NEW GAMA EARTHMOVERS</div></header>
<main>
<div class="hero"><h1>My Orders</h1><p>Track your spare-parts orders like an ecommerce order.</p></div>
<div id="list" class="loading">Loading your orders...</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://gozvchqatiyebpnycubl.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvenZjaHFhdGl5ZWJwbnljdWJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5Nzk0MjksImV4cCI6MjEwMzU1NTQyOX0.dkmoWjirh_J8L4c4x9QTisyMQy3lrWe4HQdZiHKAF40';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const list=document.getElementById('list');
const esc=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML};
const money=v=>'₹'+Number(v||0).toLocaleString('en-IN');
function stepIndex(o){
 const st=String(o.status||o.order_status||'new').toLowerCase();
 if(st==='completed'||st==='delivered'||st==='picked_up')return 3;
 if(st.includes('ready'))return 2;
 if(String(o.payment_status||'').toLowerCase().includes('paid')||String(o.payment_status||'').toLowerCase().includes('confirmed'))return 1;
 return 0;
}
function label(o){
 const i=stepIndex(o);
 return ['Order Placed','Payment Processing','Ready for Pickup','Completed'][i];
}
function tracking(o){
 const i=stepIndex(o), labels=['Order Placed','Payment','Ready for Pickup','Completed'];
 return `<div class="track"><div class="steps"><div class="line"></div>${labels.map((x,n)=>`<div class="step ${n<i?'done':n===i?'active':''}"><div class="dot">${n<i?'✓':n+1}</div><b>${x}</b><small>${n===i?'Current status':''}</small></div>`).join('')}</div></div>`;
}
async function load(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){location.href='users.html';return;}
 let ids=[];try{ids=JSON.parse(localStorage.getItem('ng_customer_order_ids')||'[]')}catch(_){}
 ids=[...new Set(ids.map(String).filter(Boolean))];
 if(!ids.length){list.innerHTML='<div class="empty"><div style="font-size:42px">📦</div><h2>No orders yet</h2><p>Your orders placed from this browser will appear here with live tracking.</p><button class="btn primary" onclick="location.href=\'index.html#parts\'">Browse Parts</button></div>';return;}
 const {data,error}=await sb.from('new_gama_orders').select('*').in('id',ids).order('created_at',{ascending:false});
 if(error){list.innerHTML='<div class="empty"><h2>Orders could not be loaded</h2><p>'+esc(error.message)+'</p></div>';return;}
 if(!data?.length){list.innerHTML='<div class="empty"><h2>No orders found</h2><p>Your saved order list is empty or unavailable.</p></div>';return;}
 list.innerHTML=data.map(o=>`<article class="order"><div class="top"><div><div class="product">${esc(o.product_name||'Product')}</div><div class="id">Order #${esc(o.id)}</div><div class="date">${o.created_at?new Date(o.created_at).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):''}</div></div><div style="text-align:right"><div class="amount">${money(o.total_amount)}</div><span class="status ${stepIndex(o)===3?'done':''}">${esc(label(o))}</span></div></div><div class="meta">Quantity: ${esc(o.quantity||1)} • Payment: ${esc(o.payment_method||'—')} • Pickup from shop</div>${tracking(o)}<div class="actions"><button class="btn" onclick="location.href='product.html?id=${encodeURIComponent(o.product_id||'')}'">View Product</button><button class="btn primary" onclick="location.reload()">↻ Refresh Tracking</button></div></article>`).join('');
}
load();
</script>
</body></html>
